name: Release

# Builds the Isothrum desktop app for macOS (Apple Silicon + Intel), Windows and Linux and publishes
# the installers to a GitHub Release. Trigger by pushing a tag like `v1.0.0` (or run manually from the
# Actions tab). The release is always left as a DRAFT: a human reviews the assets and publishes it
# (see RELEASE.md). Nothing is published, shipped or auto-updated by this workflow on its own.
#
# Beside the installers the draft carries CycloneDX SBOMs of the Rust and npm dependencies,
# SHA256SUMS of every asset with its keyless Sigstore signature (SHA256SUMS.sigstore.json, cosign),
# a build provenance attestation of each asset and an SBOM attestation of each installer. Each
# build checks the signatures it made. README.md ("Verify a download") shows a user how to check a
# download.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  # One release per tag/ref at a time; never cancel one mid-upload.
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Least privilege at the top: only the jobs that write to the GitHub Release (prepare, sbom,
# release, attest) raise themselves to contents: write below; attest alone signs.
permissions:
  contents: read

jobs:
  # The check (gate.yml): a tag doesn't run it otherwise, and nothing is built unless it passes.
  gate:
    uses: ./.github/workflows/gate.yml

  # The draft release, made once before the builds so the matrix legs only upload to it (no two
  # platform jobs racing to create the same release). Uses the workflow's GITHUB_TOKEN.
  prepare:
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.draft.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # Each build signs what it has secrets for (the sign steps below test each one): a missing
      # secret ships that platform unsigned, and this step says which, before any build. It sees
      # only whether each secret is set.
      - name: Signing secrets (tag builds)
        if: github.ref_type == 'tag'
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID != '' }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET != '' }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID != '' }}
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT != '' }}
          AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT != '' }}
          AZURE_SIGNING_PROFILE: ${{ secrets.AZURE_SIGNING_PROFILE != '' }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE != '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD != '' }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY != '' }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 != '' }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID != '' }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER != '' }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: |
          set -euo pipefail
          missing=()
          for name in AZURE_CLIENT_ID AZURE_CLIENT_SECRET AZURE_TENANT_ID AZURE_SIGNING_ENDPOINT \
            AZURE_SIGNING_ACCOUNT AZURE_SIGNING_PROFILE APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD \
            APPLE_SIGNING_IDENTITY APPLE_API_KEY_P8 APPLE_API_KEY_ID APPLE_API_ISSUER TAURI_SIGNING_PRIVATE_KEY; do
            if [ "${!name}" != true ]; then missing+=("$name"); fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::warning::These signing secrets aren't set, so what they sign ships unsigned: ${missing[*]}"
            echo "Not signed: ${missing[*]}" >> "$GITHUB_STEP_SUMMARY"
          fi
      - id: draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF_NAME: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          set -euo pipefail
          version=$(node -p 'require("./src-tauri/tauri.conf.json").version')
          tag="${REF_NAME:-v$version}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          for attempt in 1 2 3 4 5; do
            if gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1; then
              echo "Release $tag exists."; exit 0
            fi
            if gh release create "$tag" --repo "${{ github.repository }}" --draft --target "${{ github.sha }}" \
                --title "Isothrum v$version" --notes "Download the installer for your platform below."; then
              exit 0
            fi
            echo "Creating $tag failed (attempt $attempt); retrying."
            sleep $((attempt * 15))
          done
          exit 1

  # CycloneDX SBOMs of what the app is built from, made once (they are the same on every
  # platform) and attached to the draft: the Rust crates (cargo-cyclonedx, every target) and the
  # npm packages (npm's own `npm sbom`, from the lockfile, without the build-only ones).
  sbom:
    needs: prepare
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    # Uploads the SBOMs to the draft release.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-cyclonedx@0.5.9
      - name: SBOMs
        run: |
          set -euo pipefail
          mkdir -p sbom
          cargo cyclonedx --manifest-path src-tauri/Cargo.toml --format json --spec-version 1.5 \
            --target all --override-filename isothrum-desktop-rust.cdx
          mv src-tauri/isothrum-desktop-rust.cdx.json sbom/
          # npm names the SBOM's subject by package.json's version, which only tauri.conf.json has.
          npm pkg set version="$(node -p 'require("./src-tauri/tauri.conf.json").version')"
          npm sbom --sbom-format cyclonedx --sbom-type application --omit dev --package-lock-only \
            > sbom/isothrum-desktop-npm.cdx.json
          jq -e '.bomFormat == "CycloneDX"' sbom/*.cdx.json >/dev/null
      - name: Attach them to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release upload "$TAG" sbom/isothrum-desktop-rust.cdx.json sbom/isothrum-desktop-npm.cdx.json --clobber --repo "${{ github.repository }}"

  release:
    needs: [prepare, sbom]
    # Uploads the built installers to the GitHub Release (tauri-action + the DMG re-upload).
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS per-arch: a .dmg for Apple Silicon and one for Intel. Each arch builds on its own
          # leg so the compile stays inside the timeout and the cache warms per arch; the universal
          # build (both arches, cold cache) overran even 150 minutes.
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
            rust-targets: "aarch64-apple-darwin"
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
            rust-targets: "x86_64-apple-darwin"
          # Linux on ubuntu-22.04: its glibc is the floor the shipped .deb / AppImage target, so the
          # installers run on older distros. Do not move this to a newer runner.
          - platform: ubuntu-22.04
            args: ""
            rust-targets: ""
          - platform: windows-latest
            args: ""
            rust-targets: ""

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Tauri v2 build prerequisites for Linux (WebKitGTK, AppIndicator, etc.).
      - if: startsWith(matrix.platform, 'ubuntu')
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libxdo-dev \
            patchelf \
            build-essential \
            curl wget file

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm

      # Pinned to the stable branch's commit (not the moving `@stable` ref); `toolchain: stable`
      # names the channel explicitly, since a SHA no longer carries it in the ref.
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # The whole src-tauri workspace, so the restored target dir covers the heavy
          # isoloom/isothrum crate graph (they compile into src-tauri/target), not just this crate.
          workspaces: src-tauri
          # Distinct cache per matrix leg: the two macOS arch legs share a runner OS and job name, so
          # without this they would clobber each other's cache.
          key: ${{ matrix.args }}
          # Still save the warmed dependency cache when a leg fails after compiling (e.g. a flaky
          # notarize or upload, or a timeout-adjacent error): the next run restores it instead of
          # recompiling ~500 crates from cold — the difference between a ~5 min and a ~90 min leg.
          cache-on-failure: true

      # Installs @isothrum/editor + @tauri-apps/cli from the lockfile. `tauri build` runs the
      # config's beforeBuildCommand (`npm run editor`), which needs these present.
      - run: npm ci

      # Windows Authenticode via Azure Trusted Signing. Tauri runs signCommand on the app binary and
      # the MSI installer. Skipped (unsigned build) until the AZURE_* secrets exist; an absent cert
      # never fails the build. SmartScreen warns on install until these are set.
      - name: Set up Authenticode signing (Windows)
        if: startsWith(matrix.platform, 'windows') && env.AZURE_CLIENT_ID != ''
        shell: bash
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ secrets.AZURE_SIGNING_PROFILE }}
        run: |
          set -euo pipefail
          cargo install trusted-signing-cli --version 0.11.0 --locked
          # JavaScript in single quotes: its ${...} are template literals, not shell expansions.
          # shellcheck disable=SC2016
          node -e '
            const fs = require("fs"), p = "src-tauri/tauri.conf.json", c = JSON.parse(fs.readFileSync(p, "utf8"));
            const e = process.env;
            c.bundle.windows = { ...c.bundle.windows, signCommand:
              `trusted-signing-cli -e ${e.AZURE_SIGNING_ENDPOINT} -a ${e.AZURE_SIGNING_ACCOUNT} -c ${e.AZURE_SIGNING_PROFILE} -d Isothrum %1` };
            fs.writeFileSync(p, JSON.stringify(c, null, 2));
          '

      # Notarization uses an App Store Connect API key. GitHub secrets can only hold text, so the
      # .p8 is stored base64-encoded and written to a file here; the path and key id are exported
      # for the tauri-action step below. macOS only.
      - name: Prepare notarization API key (macOS)
        if: matrix.platform == 'macos-latest' && env.APPLE_API_KEY_P8 != ''
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          set -euo pipefail
          echo "$APPLE_API_KEY_P8" | base64 --decode > "$RUNNER_TEMP/apple_api_key.p8"
          echo "APPLE_API_KEY=$APPLE_API_KEY_ID" >> "$GITHUB_ENV"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/apple_api_key.p8" >> "$GITHUB_ENV"

      # macOS Developer ID signing cert. Exported only when the cert secret exists (like the
      # notarization key above), so an absent cert yields an unsigned build rather than a failed
      # `security import` on an empty value. tauri-action reads these from the job env.
      - name: Set up macOS code signing
        if: matrix.platform == 'macos-latest' && env.APPLE_CERTIFICATE != ''
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          {
            printf 'APPLE_CERTIFICATE<<_EOF_\n%s\n_EOF_\n' "$APPLE_CERTIFICATE"
            printf 'APPLE_CERTIFICATE_PASSWORD<<_EOF_\n%s\n_EOF_\n' "$APPLE_CERTIFICATE_PASSWORD"
            printf 'APPLE_SIGNING_IDENTITY<<_EOF_\n%s\n_EOF_\n' "$APPLE_SIGNING_IDENTITY"
          } >> "$GITHUB_ENV"

      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater artifact signing (minisign) - produces the signed .sig bundles + latest.json
          # the installed app's auto-updater verifies against the pubkey in tauri.conf.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # macOS code signing: Developer ID Application cert (.p12) imported by tauri-action.
          # The notarization key and the signing cert come from the GITHUB_ENV set in the steps
          # above (exported only when their secrets exist), so they are not listed here; an absent
          # cert simply yields an unsigned build. APPLE_API_ISSUER is harmless when empty (it is
          # only used alongside the key, which is itself absent then).
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          # Read by trusted-signing-cli (Windows signCommand); unused elsewhere.
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseName: "Isothrum v__VERSION__"
          releaseBody: "Download the installer for your platform below."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      # Every Windows file Tauri signed must carry a valid Authenticode signature: the MSI and the
      # app inside it. Runs whenever signing was set up.
      - name: Verify the Authenticode signatures (Windows)
        if: startsWith(matrix.platform, 'windows') && env.AZURE_CLIENT_ID != ''
        shell: pwsh
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(Get-ChildItem 'src-tauri/target/release/bundle/msi/*.msi' -ErrorAction SilentlyContinue)
          if (-not $files) { throw 'No installer was built.' }
          $files += Get-Item 'src-tauri/target/release/isothrum-desktop.exe'
          $bad = 0
          foreach ($f in $files) {
            $sig = Get-AuthenticodeSignature -FilePath $f.FullName
            Write-Host "$($f.Name): $($sig.Status) ($($sig.SignerCertificate.Subject))"
            if ($sig.Status -ne 'Valid') { Write-Host "::error::$($f.Name) is not validly signed: $($sig.StatusMessage)"; $bad++ }
          }
          if ($bad -gt 0) { exit 1 }

      # The app's code signature, deep and strict, and Gatekeeper's verdict on it (Developer ID,
      # notarized and stapled by tauri-action). Runs whenever signing was set up; Gatekeeper's
      # check needs the notarization key too.
      - name: Verify the code signature (macOS)
        if: matrix.platform == 'macos-latest' && env.APPLE_CERTIFICATE != ''
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          TARGET: ${{ matrix.rust-targets }}
        run: |
          set -euo pipefail
          app=$(find "src-tauri/target/$TARGET/release/bundle/macos" -maxdepth 1 -name '*.app' | head -1)
          test -n "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv "$app" 2>&1 | grep -E '^(Authority|TeamIdentifier)='
          if [ -n "${APPLE_API_KEY_PATH:-}" ]; then
            spctl -a -vvv -t exec "$app"
          fi

      # tauri-action notarizes + staples the .app but ships the DMG wrapper un-notarized. Notarize +
      # staple the DMG itself and replace it on the release so a downloaded DMG opens with no
      # Gatekeeper warning. macOS + tag builds only, and only when the notarization key is present.
      - name: Notarize + staple the DMG (macOS)
        if: matrix.platform == 'macos-latest' && github.ref_type == 'tag' && env.APPLE_API_KEY_PATH != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Tauri names the DMG itself (no odd characters); take the one there is.
          # shellcheck disable=SC2012
          dmg=$(ls src-tauri/target/*/release/bundle/dmg/*.dmg | head -1)
          echo "Notarizing $dmg"
          xcrun notarytool submit "$dmg" \
            --key "$APPLE_API_KEY_PATH" --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER" --wait
          xcrun stapler staple "$dmg"
          spctl -a -vvv -t open --context context:primary-signature "$dmg"
          gh release upload "$TAG" "$dmg" --clobber --repo "${{ github.repository }}"

      # The runner is ephemeral, but don't leave the notarization key on disk any longer than needed.
      - name: Remove the notarization API key (macOS)
        if: always() && matrix.platform == 'macos-latest'
        shell: bash
        run: rm -f "$RUNNER_TEMP/apple_api_key.p8"

  # Every asset is on the draft (each DMG replaced by its notarized copy): SHA256SUMS of them all,
  # signed keylessly with cosign (the certificate names this workflow at the tag, recorded in
  # Sigstore's public log), a build provenance attestation of each asset and an SBOM attestation
  # of each installer (Sigstore-signed, stored by GitHub). Runs when the draft exists, whatever
  # the builds did: a platform whose build failed is missing from the draft, which a human reviews
  # before publishing it. Nothing built at all is the one failure.
  attest:
    needs: [prepare, release]
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # read the draft's assets, upload SHA256SUMS and its signature
      id-token: write # sign SHA256SUMS and the attestations (Sigstore, keyless: no key is stored)
      attestations: write
    steps:
      - name: Checksums of every asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          gh release download "$TAG" --repo "${{ github.repository }}" --dir assets
          # A re-run finds the SHA256SUMS of the run before and its signature: they aren't subjects.
          rm -f assets/SHA256SUMS assets/SHA256SUMS.sigstore.json
          (cd assets && sha256sum -- *) > SHA256SUMS
          cat SHA256SUMS
          # The installers the SBOMs describe: every asset but the SBOMs and the updater's
          # manifest and signatures.
          if ! grep -vE '  (.*\.cdx\.json|latest\.json|.*\.sig)$' SHA256SUMS > packages.sha256; then
            echo "::error::No build uploaded an installer: nothing to attest."
            exit 1
          fi
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: SHA256SUMS
      # The SBOMs (the sbom job's), each attested of every installer: `gh attestation verify
      # <file> --repo <this repo> --predicate-type https://cyclonedx.org/bom`.
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: packages.sha256
          sbom-path: assets/isothrum-desktop-rust.cdx.json
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: packages.sha256
          sbom-path: assets/isothrum-desktop-npm.cdx.json
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4
      # A keyless signature: the certificate names this workflow at the ref it ran for, and the
      # signature is recorded in Sigstore's public transparency log (Rekor). Then checked as a user
      # checks it (README.md, "Verify a download").
      - name: Sign SHA256SUMS
        env:
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS
          cosign verify-blob SHA256SUMS --bundle SHA256SUMS.sigstore.json \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${REF}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
      - name: Attach SHA256SUMS and its signature to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release upload "$TAG" SHA256SUMS SHA256SUMS.sigstore.json --clobber --repo "${{ github.repository }}"

  # Windows: the same release to the Microsoft Store (MSIX, signed by the Store at distribution).
  # Its own reusable-workflow call, so a Store hiccup (a submission still in certification blocks a
  # new one) never holds back the GitHub draft release. Tag builds only. STORE_PRODUCT_ID is a
  # secret, and a job-level `if:` cannot read secrets, so the leg isn't gated on it here; instead the
  # submit step inside msix.yml no-ops with a clear message when the secret is unset, so a release
  # without a Store listing is never failed by it.
  store:
    needs: release
    if: github.ref_type == 'tag'
    uses: ./.github/workflows/msix.yml
    with:
      tag: ${{ github.ref_name }}
      # Repo variable STORE_AUTO_SUBMIT=false: leave the Store submission as a draft to review in
      # Partner Center instead of sending it for certification.
      commit: ${{ vars.STORE_AUTO_SUBMIT != 'false' }}
    # Only the Partner Center credentials, not every repo secret.
    secrets:
      STORE_TENANT_ID: ${{ secrets.STORE_TENANT_ID }}
      STORE_CLIENT_ID: ${{ secrets.STORE_CLIENT_ID }}
      STORE_CLIENT_SECRET: ${{ secrets.STORE_CLIENT_SECRET }}
      STORE_PRODUCT_ID: ${{ secrets.STORE_PRODUCT_ID }}
