name: Gate

# Before main (pull requests into main, pushes to main) and before a release (release.yml calls
# it, and builds nothing unless it passes): the check on Linux, macOS and Windows. The tests that
# need Docker or Vagrant (`npm run check:real`) run on the maintainers' test machines.
#
# A job here only sets up the runner and runs the check: the two can't drift.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_call:
  workflow_dispatch:

concurrency:
  group: gate-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: npm run check
